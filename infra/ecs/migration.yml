AWSTemplateFormatVersion: '2010-09-09'
Description: One-shot schema migration; never runs as an ECS service
Parameters:
  FoundationStack: {Type: String, Default: nanas-foundation}
  MigrationImage:
    Type: String
    AllowedPattern: '.+@sha256:[a-f0-9]{64}'
Resources:
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${FoundationStack}-migrate'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn:
        Fn::ImportValue: !Sub '${FoundationStack}-MigrationExecutionRole'
      ContainerDefinitions:
        - Name: migrate
          Image: !Ref MigrationImage
          Essential: true
          StopTimeout: 120
          Environment:
            - Name: DB_HOST
              Value: {Fn::ImportValue: !Sub '${FoundationStack}-DatabaseHost'}
            - {Name: DB_NAME, Value: culture_eats}
            - {Name: DB_USER, Value: nanas_admin}
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Join ['', [{Fn::ImportValue: !Sub '${FoundationStack}-DatabaseAdminSecret'}, ':password::']]
            - Name: APP_DB_PASSWORD
              ValueFrom: !Join ['', [{Fn::ImportValue: !Sub '${FoundationStack}-AppDatabaseSecret'}, ':password::']]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref AWS::Region
              awslogs-group: !Sub '/ecs/${FoundationStack}/migrate'
              awslogs-stream-prefix: ecs
Outputs:
  TaskDefinition: {Value: !Ref Task}
