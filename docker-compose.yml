services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: culture
      POSTGRES_PASSWORD: culture
      POSTGRES_DB: culture_eats
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  # Only needed when running the app or the tests with STORAGE_PROVIDER=s3, so it sits behind
  # a profile rather than costing memory on every `docker compose up -d`:
  #   docker compose --profile s3 up -d
  # Console on :9001. The bucket is not created for you - infrastructure's job in the real
  # setup, and the tests create their own.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
volumes:
  dbdata:
