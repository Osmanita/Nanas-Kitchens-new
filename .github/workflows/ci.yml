name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: culture, POSTGRES_PASSWORD: culture, POSTGRES_DB: culture_eats }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://culture:culture@localhost:5432/culture_eats
      REDIS_URL: redis://localhost:6379
      # Throwaway CI values, but they must satisfy the real rules (>= 32 chars) so a length
      # regression fails here instead of in someone's deployment. The old ones were 9 and 11
      # characters, and ADDRESS_ENC_KEY was the literal that used to ship in .env.example.
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-chars
      ADDRESS_ENC_KEY: ci-only-address-enc-key-32-chars-min
    steps:
      - uses: actions/checkout@v4
      # version comes from package.json "packageManager" — specifying it here too makes
      # pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      # @prisma/client's postinstall runs from the hoisted workspace root and cannot find
      # apps/api/prisma/schema.prisma, so it emits a stub client with no model types and
      # apps/api then fails to typecheck ("Property 'dish' does not exist on type '{}'",
      # implicit any on $transaction / $queryRaw / map callbacks). "migrate deploy" does
      # not generate either. Locally this is masked by a client generated during earlier
      # work that stays in node_modules, so the break only ever shows up in CI.
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api prisma:migrate:deploy
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # apps/api-java is not a pnpm workspace project, so the job above never touched it: the
  # Spring backend - auth, payments, the payout maths, the webhook signature check - was
  # never compiled or tested in CI at all, and a green tick said nothing about it.
  java:
    runs-on: ubuntu-latest
    services:
      # PostGIS, not plain postgres: the raw-SQL search path calls ST_DWithin/ST_MakePoint,
      # and the integration tests replay the Prisma migrations, which enable the extension.
      # Its own database, separate from the `test` job's: IntegrationTest drops and recreates
      # `schema public` on every run and refuses any database not named *_test.
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: culture, POSTGRES_PASSWORD: culture, POSTGRES_DB: nanas_test }
        ports: ["5432:5432"]
        # -h localhost on purpose: during initdb the image runs a temporary server bound to the
        # Unix socket only, and a bare `pg_isready` reports healthy against THAT — releasing the
        # job before the TCP listener on 5432 exists.
        options: >-
          --health-cmd "pg_isready -h localhost -U culture -d nanas_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # mvnw is stored with LF and mode 100755, so it runs as-is on a Linux runner.
      # The whole suite runs now, *IntegrationTest included: IntegrationTest prefers
      # TEST_DATABASE_URL over Testcontainers, so it uses the service container above and
      # never needs a Docker socket of its own. MigrationRunner resolves the Prisma
      # migrations relative to this working directory (../api/prisma/migrations).
      - name: Compile and test the Spring backend
        working-directory: apps/api-java
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/nanas_test
          TEST_DATABASE_USER: culture
          TEST_DATABASE_PASSWORD: culture
        run: ./mvnw -B test
