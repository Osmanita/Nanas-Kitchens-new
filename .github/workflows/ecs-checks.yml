name: ECS readiness
on:
  workflow_dispatch:
  push:
    branches: [osman, main]
    paths:
      - 'infra/ecs/**'
      - 'scripts/ecs/**'
      - 'apps/**/Dockerfile*'
      - 'apps/api-java/src/**'
      - 'apps/api/prisma/**'
      - 'apps/web/**'
      - '.dockerignore'
      - '.github/workflows/ecs-checks.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    paths:
      - 'infra/ecs/**'
      - 'scripts/ecs/**'
      - 'apps/**/Dockerfile*'
      - 'apps/api-java/src/**'
      - 'apps/api/prisma/**'
      - 'apps/web/**'
      - '.dockerignore'
      - '.github/workflows/ecs-checks.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r infra/ecs/requirements.txt
      - run: cfn-lint infra/ecs/foundation.yml infra/ecs/migration.yml infra/ecs/application.yml
      - run: node --test scripts/ecs/migrate.test.cjs
      - run: bash -n scripts/ecs/deploy.sh
      - run: shellcheck scripts/ecs/deploy.sh scripts/ecs/deploy.test.sh
      - run: bash scripts/ecs/deploy.test.sh
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: web, dockerfile: apps/web/Dockerfile}
          - {name: api, dockerfile: apps/api-java/Dockerfile}
          - {name: migrate, dockerfile: apps/api/Dockerfile.migrate}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: NEXT_PUBLIC_API_URL=https://api.nanaskitchens.app
          cache-from: type=gha,scope=ecs-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ecs-${{ matrix.name }}
